version: "3.8"
services:
  frontend:
    build: .
    ports:
      - "5173:5173"
    volumes:
      - .:/app:delegated
      - /app/node_modules
    environment:
      # Use polling for file watchers in some environments (Windows, WSL)
      - CHOKIDAR_USEPOLLING=true
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    stdin_open: true
    tty: true
